name: One-time mobile asset formatter
on:
  push:
    branches: [feat/phone-monitor-sync-2026-10]
    paths:
      - .github/workflows/format-phone-assets.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phone-monitor-sync-2026-10
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format assets
        run: |
          npx prettier --write landing/public/phone.css landing/public/phone.js
          rm .github/workflows/format-phone-assets.yml
          git add landing/public/phone.css landing/public/phone.js .github/workflows/format-phone-assets.yml
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Format mobile companion assets"
            git push origin HEAD:feat/phone-monitor-sync-2026-10
          fi
