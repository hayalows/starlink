name: Prepare phone companion release
on:
  push:
    branches: [feat/phone-monitor-sync-2026-10]
    paths:
      - .github/workflows/prepare-phone-release.yml
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phone-monitor-sync-2026-10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install and format
        run: |
          npm ci --no-audit --no-fund
          cd landing
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm run build
          cd ..
          npx prettier --write docs/phone-sync/README.md docs/phone-sync/001_phone_monitor.sql src/components/ghana/PhoneConnect.tsx landing/api/monitor.ts scripts/test-phone-sync-backend.mjs || true
          npx prettier --write docs/phone-sync/README.md src/components/ghana/PhoneConnect.tsx landing/api/monitor.ts scripts/test-phone-sync-backend.mjs
          rm .github/workflows/prepare-phone-release.yml
          git add landing/package-lock.json docs/phone-sync/README.md src/components/ghana/PhoneConnect.tsx landing/api/monitor.ts scripts/test-phone-sync-backend.mjs .github/workflows/prepare-phone-release.yml
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Prepare tested Starlink phone companion release"
            git pull --rebase origin feat/phone-monitor-sync-2026-10
            git push origin HEAD:feat/phone-monitor-sync-2026-10
          fi
