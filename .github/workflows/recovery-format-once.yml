name: One-time format v1.6 recovery branch
on:
  push:
    branches: [feat/ghana-v160-recovery-vault]
    paths:
      - ".github/workflows/recovery-format-once.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ghana-v160-recovery-vault
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: |
          npx prettier --write \
            core/ghanaBackup.ts core/ghanaBackup.test.ts \
            core/ghanaArchive.ts core/ghanaArchive.test.ts \
            src/lib/ghanaVaultHost.ts src/components/ghana/HistoryVault.tsx \
            src/components/ghana/GhanaHome.tsx \
            extension/lib/archiveVault.ts extension/lib/phoneSync.ts \
            extension/entrypoints/background.ts extension/entrypoints/dashboard/main.tsx \
            landing/api/archive.ts landing/public/phone.js \
            landing/public/live/sw.js landing/src/pages/live.astro \
            landing/src/pages/privacy.astro landing/scripts/check-site-153.mjs \
            supabase/functions/starlink-history-vault/index.ts \
            docs/ghana-release-notes.md
          rm .github/workflows/recovery-format-once.yml
          git config user.name "starlink-recovery-format-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Format v1.6 recovery files and remove temporary formatting workflow"
            git push origin HEAD:feat/ghana-v160-recovery-vault
          fi
