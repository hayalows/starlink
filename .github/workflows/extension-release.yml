name: Build Starlink Ghana Chrome extension
on:
  push:
    tags:
      - "monitor-v*"
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run zip:extension
      - name: Prepare release package
        run: |
          cp .output/dishylink-1.2.0-chrome.zip starlink-ghana-monitor-chrome.zip
      - name: Publish extension package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" starlink-ghana-monitor-chrome.zip \
            --title "Starlink Ghana Monitor $GITHUB_REF_NAME" \
            --notes "Starlink Ghana Monitor browser extension. Unzip and load through chrome://extensions using Developer mode."
