name: Build Starlink Ghana Chrome extension
on:
  push:
    branches: [master]
    paths:
      - "package.json"
      - "wxt.config.ts"
      - "extension/**"
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run zip:extension
      - name: Prepare package
        run: cp .output/dishylink-1.2.0-chrome.zip starlink-ghana-monitor-chrome.zip
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "monitor-v1.2.0" starlink-ghana-monitor-chrome.zip \
            --target "$GITHUB_SHA" \
            --title "Starlink Ghana Monitor 1.2.0" \
            --notes "Starlink Ghana Monitor browser extension. Unzip and load through chrome://extensions using Developer mode."
