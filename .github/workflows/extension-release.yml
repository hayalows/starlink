name: Build Starlink Ghana Chrome extension
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/extension-release.yml"
      - "package*.json"
      - "wxt.config.ts"
      - "extension/**"
      - "src/**"
      - "core/**"
      - "cloud/**"
      - "public/**"
      - "tsconfig*.json"
permissions:
  contents: write
concurrency:
  group: starlink-extension-release
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run typecheck:extension
      - run: npm test -- --project node core/ghanaCost.test.ts
      - run: npm run zip:extension
      - name: Prepare package
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          cp ".output/dishylink-${VERSION}-chrome.zip" starlink-ghana-monitor-chrome.zip
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=monitor-v${VERSION}-${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
      - name: Publish update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --latest \
              --title "Starlink Ghana Monitor $VERSION" --notes-file docs/ghana-release-notes.md
          fi
          gh release upload "$TAG" starlink-ghana-monitor-chrome.zip --clobber
