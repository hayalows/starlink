name: One-time format of cost clarity branch
on:
  push:
    branches: ["fix/cost-clarity-confidence-20261009"]
    paths: [".github/workflows/format-cost-clarity.yml"]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cost-clarity-confidence-20261009
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format only modified source files
        run: |
          npx prettier --write core/ghanaForecastQuality.ts landing/public/phone.js src/components/data-usage/GhanaCostPanel.tsx src/components/ghana/GhanaHome.tsx src/hooks/useGhanaAnalysis.ts
          git diff --check
      - name: Record formatting adjustment on the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/ghanaForecastQuality.ts landing/public/phone.js src/components/data-usage/GhanaCostPanel.tsx src/components/ghana/GhanaHome.tsx src/hooks/useGhanaAnalysis.ts
          git diff --cached --quiet || git commit -m "Apply Prettier to cost clarity release sources"
          git push origin HEAD:fix/cost-clarity-confidence-20261009
